<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archer Developer Documentation</title>
  <meta name="description" content="Archer API reference and MCP connector documentation." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233ee6b0%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --accent:#0f9d76; color-scheme: light; }
    body { background:#fff; color:#2c3e50; }
    .sidebar { border-right:1px solid #e6ecea; }
    .sidebar-nav li > p { font-weight:700; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:#8a9a95; margin:1.4em 0 .4em; }
    .app-name-link { font-weight:700 !important; letter-spacing:-.01em; }
    .markdown-section { max-width:820px; }
    .markdown-section h1 { letter-spacing:-.02em; }
    .markdown-section table { display:table; width:100%; }
    .markdown-section tr:nth-child(2n) { background:#fafbfb; }
    .markdown-section a { color:var(--accent); }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin:2em 0; }
    .card { display:block; border:1px solid #e6ecea; border-radius:10px; padding:18px 20px; text-decoration:none !important; transition:border-color .15s, transform .15s; }
    .card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .card b { display:block; color:#12201c; font-size:1.02rem; margin-bottom:.3em; }
    .card span { color:#5b6b66; font-size:.9rem; line-height:1.5; display:block; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'Archer Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      search: { placeholder: 'Search the docs', noData: 'Nothing found', depth: 3 },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
